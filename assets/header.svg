      <ellipse cx="1010" cy="146" rx="170" ry="86" transform="rotate(30 1010 146)" stroke-opacity="0.23"/>
      <ellipse cx="1010" cy="146" rx="170" ry="86" transform="rotate(90 1010 146)" stroke-opacity="0.23"/>
      <circle cx="1010" cy="146" r="53" stroke-opacity="0.32"/>
      <path d="M865 125L968 72L1064 114L1105 222L969 220L865 125L1010 146L1105 222M968 72L1010 146L969 220M1010 146L1064 114" stroke-opacity="0.38"/>
    </g>
