<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Taron.</title>
  <desc id="desc">Multimodal learning and recommendation, LLM agents and planning, multimodal RAG, and physically consistent video generation. A navy banner with mint network graphics.</desc>
  <defs>
